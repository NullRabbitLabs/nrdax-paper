<text x="0" y="392" font-size="11" fill="#52514e">Termination occupies one cell by definition: a single input that faults the node involves no accumulation,</text>
<text x="0" y="407" font-size="11" fill="#52514e">so no bound could have failed in any other way. The other four rows span modes as the corpus populates them.</text>
