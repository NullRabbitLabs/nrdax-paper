<text x="627.0" y="134" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">97</text>
<text x="627.0" y="182" font-size="10.5" fill="#52514e" text-anchor="middle">mechanism read off</text>
<text x="627.0" y="197" font-size="10.5" fill="#52514e" text-anchor="middle">the reproduction</text>
<path d="M708 120 L730 120" stroke="#52514e" stroke-width="2" marker-end="url(#b)"/>
<rect x="736" y="78" width="150" height="84" rx="6" fill="#184f95" stroke="#d8d7d2"/>
<text x="811.0" y="104" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Published</text>
<text x="811.0" y="134" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">97</text>
<text x="811.0" y="182" font-size="10.5" fill="#52514e" text-anchor="middle">permanent id, JSON,</text>
<text x="811.0" y="197" font-size="10.5" fill="#52514e" text-anchor="middle">STIX, JSON-LD</text>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7 z" fill="#52514e"/></marker></defs>
<text x="0" y="234" font-size="11" fill="#52514e">303 techniques are recorded from a public advisory with no reproduction, so no mechanism can be read and none is inferred.</text>
