<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Georgia,serif"><rect width="900" height="250" fill="#fcfcfb"/>
<text x="0" y="22" font-size="15" font-weight="bold" fill="#0b0b0b">Figure 3. How a technique enters the registry, and where the population falls away</text>
<text x="0" y="42" font-size="11.5" fill="#52514e">Classification is gated on reproduction. The gate is one-directional: not every reproduction is classified.</text>
<rect x="0" y="78" width="150" height="84" rx="6" fill="#9ec5f4" stroke="#d8d7d2"/>
<text x="75.0" y="104" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Candidate</text>
<text x="75.0" y="134" font-size="20" font-weight="bold" fill="#0b0b0b" text-anchor="middle">421 published</text>
<text x="75.0" y="182" font-size="10.5" fill="#52514e" text-anchor="middle">advisory, source review,</text>
<text x="75.0" y="197" font-size="10.5" fill="#52514e" text-anchor="middle">or a prior mechanism</text>
<path d="M156 120 L178 120" stroke="#52514e" stroke-width="2" marker-end="url(#b)"/>
<rect x="184" y="78" width="150" height="84" rx="6" fill="#6da7ec" stroke="#d8d7d2"/>
<text x="259.0" y="104" font-size="12" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Reproduced</text>
<text x="259.0" y="134" font-size="20" font-weight="bold" fill="#0b0b0b" text-anchor="middle">118</text>
<text x="259.0" y="182" font-size="10.5" fill="#52514e" text-anchor="middle">delivered over the wire,</text>
<text x="259.0" y="197" font-size="10.5" fill="#52514e" text-anchor="middle">evidence captured</text>
<path d="M340 120 L362 120" stroke="#52514e" stroke-width="2" marker-end="url(#b)"/>
<rect x="368" y="78" width="150" height="84" rx="6" fill="#3987e5" stroke="#d8d7d2"/>
<text x="443.0" y="104" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">In scope</text>
<text x="443.0" y="134" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">104</text>
<text x="443.0" y="182" font-size="10.5" fill="#52514e" text-anchor="middle">network-boundary /</text>
<text x="443.0" y="197" font-size="10.5" fill="#52514e" text-anchor="middle">node-resource class</text>
<path d="M524 120 L546 120" stroke="#52514e" stroke-width="2" marker-end="url(#b)"/>
<rect x="552" y="78" width="150" height="84" rx="6" fill="#256abf" stroke="#d8d7d2"/>
